<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบเช็คคลังสินค้า</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Sarabun', 'Segoe UI', sans-serif;
    background: #3f3f3f;
    margin: 0;
    padding: 20px;
    color: #ececec;
  }
  .container { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 16px; color: #f5c518; font-weight: 600; }

  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  input, select, button {
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid #6b6b6b;
    font-size: 14px;
    background: #565656;
    color: #ececec;
  }
  input::placeholder { color: #b0b0b0; }
  input:focus, select:focus { outline: none; border-color: #f5c518; }
  #searchBox { flex: 1; min-width: 200px; }
  button {
    background: #f5c518;
    color: #2b2b2b;
    border: 1px solid #d8ab0c;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { background: #ffd633; }
  button.secondary { background: #6b6b6b; border-color: #7c7c7c; color: #f0f0f0; }
  button.secondary:hover { background: #7c7c7c; }
  button.danger { background: #8a4a4a; border-color: #a05858; color: #ffe2e2; }
  button.danger:hover { background: #9c5454; }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #4a4a4a;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    border: 1px solid #5a5a5a;
  }
  th, td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid #5a5a5a;
    font-size: 14px;
  }
  th {
    background: #2b2b2b;
    color: #f5c518;
    font-weight: 600;
  }
  tr:hover { background: #565656; }
  .low-stock { color: #ff9d9d; font-weight: bold; }

  .actions { display: flex; gap: 6px; }
  .actions button { padding: 5px 8px; font-size: 12px; }

  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.55);
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #4a4a4a;
    border: 1px solid #5a5a5a;
    padding: 20px;
    border-radius: 8px;
    width: 320px;
    max-width: 90vw;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  .modal h3 { margin-top: 0; color: #f5c518; }
  .modal label { display: block; margin: 10px 0 4px; font-size: 13px; color: #cfcfcf; }
  .modal input { width: 100%; }
  .modal-footer { margin-top: 16px; display: flex; gap: 8px; justify-content: flex-end; }

  #loading { text-align: center; padding: 20px; color: #b0b0b0; }
  #statusMsg { margin-bottom: 10px; font-size: 14px; }

  .category-header td {
    background: #2b2b2b;
    color: #f5c518;
    font-weight: 600;
    padding: 8px 12px;
    border-bottom: 1px solid #6b6b6b;
    font-size: 13px;
    letter-spacing: 0.3px;
  }
  #categoryFilter { min-width: 160px; }
</style>
</head>
<body>

<div class="container">
  <h1>📦 ระบบเช็คคลังสินค้า</h1>

  <div class="toolbar">
    <input type="text" id="searchBox" placeholder="ค้นหาไอดี, ชื่อสินค้า, หมวดหมู่...">
    <select id="categoryFilter" onchange="loadProducts()">
      <option value="">ทุกหมวดหมู่</option>
    </select>
    <button onclick="loadProducts()">ค้นหา</button>
    <button class="secondary" onclick="loadProducts(true)">รีเฟรชทั้งหมด</button>
    <button onclick="openAddModal()">+ เพิ่มสินค้า</button>
    <button class="secondary" onclick="openSummaryModal()">📊 สรุปยอดตามหมวดหมู่</button>
  </div>

  <div id="statusMsg"></div>
  <div id="loading">กำลังโหลดข้อมูล...</div>
  <table id="productTable" style="display:none;">
    <thead>
      <tr>
        <th>ไอดี</th>
        <th>ชื่อสินค้า</th>
        <th>หมวดหมู่</th>
        <th>คงเหลือ</th>
        <th>ตำแหน่ง</th>
        <th>อัปเดตล่าสุด</th>
        <th>จัดการ</th>
      </tr>
    </thead>
    <tbody id="productBody"></tbody>
  </table>
</div>

<!-- Modal: เพิ่มสินค้า -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h3>เพิ่มสินค้าใหม่</h3>
    <label>ไอดี</label>
    <input type="text" id="newSku">
    <label>ชื่อสินค้า</label>
    <input type="text" id="newName">
    <label>หมวดหมู่</label>
    <input type="text" id="newCategory">
    <label>จำนวนเริ่มต้น</label>
    <input type="number" id="newQuantity" value="0">
    <label>ตำแหน่งคลัง</label>
    <input type="text" id="newLocation">
    <div class="modal-footer">
      <button class="secondary" onclick="closeModal('addModal')">ยกเลิก</button>
      <button onclick="submitAdd()">บันทึก</button>
    </div>
  </div>
</div>

<!-- Modal: ปรับยอด -->
<div class="modal-overlay" id="adjustModal">
  <div class="modal">
    <h3>ปรับยอดสต็อก</h3>
    <p id="adjustSkuLabel" style="font-size:13px;color:#6b7280;"></p>
    <label>จำนวนที่เปลี่ยนแปลง (ใส่ค่าลบเพื่อลด เช่น -5)</label>
    <input type="number" id="adjustChange" value="0">
    <div class="modal-footer">
      <button class="secondary" onclick="closeModal('adjustModal')">ยกเลิก</button>
      <button onclick="submitAdjust()">บันทึก</button>
    </div>
  </div>
</div>

<!-- Modal: แก้ไขสินค้า -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>แก้ไขข้อมูลสินค้า</h3>
    <label>ไอดี</label>
    <input type="text" id="editSku">
    <label>ชื่อสินค้า</label>
    <input type="text" id="editName">
    <label>หมวดหมู่</label>
    <input type="text" id="editCategory">
    <label>จำนวนคงเหลือ</label>
    <input type="number" id="editQuantity">
    <label>ตำแหน่งคลัง</label>
    <input type="text" id="editLocation">
    <div class="modal-footer">
      <button class="secondary" onclick="closeModal('editModal')">ยกเลิก</button>
      <button onclick="submitEdit()">บันทึก</button>
    </div>
  </div>
</div>

<!-- Modal: สรุปยอดตามหมวดหมู่ -->
<div class="modal-overlay" id="summaryModal">
  <div class="modal" style="width: 420px;">
    <h3>📊 สรุปยอดสินค้าตามหมวดหมู่</h3>
    <table id="summaryTable" style="margin-top: 10px;">
      <thead>
        <tr>
          <th>หมวดหมู่</th>
          <th>จำนวนรายการ</th>
          <th>ยอดรวมคงเหลือ</th>
        </tr>
      </thead>
      <tbody id="summaryBody"></tbody>
    </table>
    <div class="modal-footer">
      <button class="secondary" onclick="closeModal('summaryModal')">ปิด</button>
    </div>
  </div>
</div>

<script>
  // ⚠️ แก้ URL นี้เป็น Web App URL ที่ได้จากการ Deploy Apps Script
  const API_URL = 'https://script.google.com/macros/s/AKfycbyKGwnYoAWuBXVefFlCCMJc703VM5I5nfnpjiXHFp-6tDPYc-fZxT66xP6ODRjPMmTO3A/exec';

  const LOW_STOCK_THRESHOLD = 5;
  let currentAdjustSku = null;
  let allCategories = new Set();
  let allItems = [];

  async function loadProducts(forceAll = false) {
    const loading = document.getElementById('loading');
    const table = document.getElementById('productTable');
    const keyword = forceAll ? '' : document.getElementById('searchBox').value.trim();
    const category = document.getElementById('categoryFilter').value;

    loading.style.display = 'block';
    table.style.display = 'none';
    setStatus('');

    try {
      const url = keyword
        ? `${API_URL}?search=${encodeURIComponent(keyword)}`
        : API_URL;
      const res = await fetch(url);
      const json = await res.json();

      if (json.status !== 'ok') throw new Error(json.message || 'โหลดข้อมูลล้มเหลว');

      let data = json.data;
      allItems = json.data;
      updateCategoryOptions(data);

      if (category) {
        data = data.filter(item => item['หมวดหมู่'] === category);
      }

      renderTable(data);
    } catch (err) {
      setStatus('เกิดข้อผิดพลาด: ' + err.message, true);
    } finally {
      loading.style.display = 'none';
      table.style.display = 'table';
    }
  }

  function updateCategoryOptions(data) {
    const select = document.getElementById('categoryFilter');
    const currentValue = select.value;

    data.forEach(item => {
      const cat = item['หมวดหมู่'];
      if (cat) allCategories.add(cat);
    });

    select.innerHTML = '<option value="">ทุกหมวดหมู่</option>';
    Array.from(allCategories).sort().forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      select.appendChild(opt);
    });
    select.value = currentValue;
  }

  function renderTable(items) {
    const tbody = document.getElementById('productBody');
    tbody.innerHTML = '';

    if (items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#9ca3af;">ไม่พบข้อมูล</td></tr>';
      return;
    }

    // จัดกลุ่มตามหมวดหมู่
    const groups = {};
    items.forEach(item => {
      const cat = item['หมวดหมู่'] || 'ไม่ระบุหมวดหมู่';
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(item);
    });

    const sortedCats = Object.keys(groups).sort();

    sortedCats.forEach(cat => {
      const headerRow = document.createElement('tr');
      headerRow.className = 'category-header';
      headerRow.innerHTML = `<td colspan="7">📁 ${escapeHtml(cat)} (${groups[cat].length} รายการ)</td>`;
      tbody.appendChild(headerRow);

      groups[cat].forEach(item => {
        const qty = Number(item['จำนวนคงเหลือ']);
        const isLow = qty <= LOW_STOCK_THRESHOLD;
        const updated = item['อัปเดตล่าสุด'] ? new Date(item['อัปเดตล่าสุด']).toLocaleString('th-TH') : '-';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${escapeHtml(item['ไอดี'])}</td>
          <td>${escapeHtml(item['ชื่อสินค้า'])}</td>
          <td>${escapeHtml(item['หมวดหมู่'])}</td>
          <td class="${isLow ? 'low-stock' : ''}">${qty} ${isLow ? '⚠️' : ''}</td>
          <td>${escapeHtml(item['ตำแหน่งคลัง'])}</td>
          <td>${updated}</td>
          <td class="actions">
            <button onclick="openEditModal('${escapeHtml(item['ไอดี'])}')">แก้ไข</button>
            <button onclick="openAdjustModal('${escapeHtml(item['ไอดี'])}')">ปรับยอด</button>
            <button class="danger" onclick="deleteProduct('${escapeHtml(item['ไอดี'])}')">ลบ</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    });
  }

  // ===== สรุปยอดตามหมวดหมู่ =====
  function openSummaryModal() {
    const summary = {};
    allItems.forEach(item => {
      const cat = item['หมวดหมู่'] || 'ไม่ระบุหมวดหมู่';
      const qty = Number(item['จำนวนคงเหลือ']) || 0;
      if (!summary[cat]) summary[cat] = { count: 0, total: 0 };
      summary[cat].count += 1;
      summary[cat].total += qty;
    });

    const tbody = document.getElementById('summaryBody');
    tbody.innerHTML = '';

    const sortedCats = Object.keys(summary).sort();

    if (sortedCats.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#9ca3af;">ไม่มีข้อมูล</td></tr>';
    } else {
      let grandTotalItems = 0;
      let grandTotalQty = 0;
      sortedCats.forEach(cat => {
        const { count, total } = summary[cat];
        grandTotalItems += count;
        grandTotalQty += total;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${escapeHtml(cat)}</td>
          <td>${count}</td>
          <td>${total}</td>
        `;
        tbody.appendChild(tr);
      });

      const totalRow = document.createElement('tr');
      totalRow.innerHTML = `
        <td style="color:#f5c518;font-weight:600;">รวมทั้งหมด</td>
        <td style="color:#f5c518;font-weight:600;">${grandTotalItems}</td>
        <td style="color:#f5c518;font-weight:600;">${grandTotalQty}</td>
      `;
      tbody.appendChild(totalRow);
    }

    document.getElementById('summaryModal').classList.add('show');
  }

  function escapeHtml(str) {
    if (str === undefined || str === null) return '';
    return String(str).replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  function setStatus(msg, isError = false) {
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.style.color = isError ? '#dc2626' : '#16a34a';
  }

  // ===== เพิ่มสินค้า =====
  function openAddModal() {
    document.getElementById('newSku').value = '';
    document.getElementById('newName').value = '';
    document.getElementById('newCategory').value = '';
    document.getElementById('newQuantity').value = 0;
    document.getElementById('newLocation').value = '';
    document.getElementById('addModal').classList.add('show');
  }

  async function submitAdd() {
    const sku = document.getElementById('newSku').value.trim();
    const name = document.getElementById('newName').value.trim();
    if (!sku || !name) { alert('กรุณากรอกไอดีและชื่อสินค้า'); return; }

    const payload = {
      action: 'add',
      sku,
      name,
      category: document.getElementById('newCategory').value.trim(),
      quantity: Number(document.getElementById('newQuantity').value) || 0,
      location: document.getElementById('newLocation').value.trim()
    };

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (json.status !== 'ok') throw new Error(json.message);
      closeModal('addModal');
      setStatus('เพิ่มสินค้าสำเร็จ');
      loadProducts(true);
    } catch (err) {
      alert('เกิดข้อผิดพลาด: ' + err.message);
    }
  }

  // ===== แก้ไขสินค้า =====
  let currentEditOriginalSku = null;

  function openEditModal(sku) {
    const item = allItems.find(i => String(i['ไอดี']) === String(sku));
    if (!item) { alert('ไม่พบข้อมูลสินค้านี้ ลองรีเฟรชแล้วลองใหม่'); return; }

    currentEditOriginalSku = item['ไอดี'];
    document.getElementById('editSku').value = item['ไอดี'];
    document.getElementById('editName').value = item['ชื่อสินค้า'];
    document.getElementById('editCategory').value = item['หมวดหมู่'];
    document.getElementById('editQuantity').value = item['จำนวนคงเหลือ'];
    document.getElementById('editLocation').value = item['ตำแหน่งคลัง'];
    document.getElementById('editModal').classList.add('show');
  }

  async function submitEdit() {
    const sku = document.getElementById('editSku').value.trim();
    const name = document.getElementById('editName').value.trim();
    if (!sku || !name) { alert('กรุณากรอกไอดีและชื่อสินค้า'); return; }

    const payload = {
      action: 'edit',
      originalSku: currentEditOriginalSku,
      sku,
      name,
      category: document.getElementById('editCategory').value.trim(),
      quantity: Number(document.getElementById('editQuantity').value) || 0,
      location: document.getElementById('editLocation').value.trim()
    };

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (json.status !== 'ok') throw new Error(json.message);
      closeModal('editModal');
      setStatus('แก้ไขข้อมูลสำเร็จ');
      loadProducts(true);
    } catch (err) {
      alert('เกิดข้อผิดพลาด: ' + err.message);
    }
  }

  // ===== ปรับยอดสต็อก =====
  function openAdjustModal(sku) {
    currentAdjustSku = sku;
    document.getElementById('adjustSkuLabel').textContent = 'ไอดี: ' + sku;
    document.getElementById('adjustChange').value = 0;
    document.getElementById('adjustModal').classList.add('show');
  }

  async function submitAdjust() {
    const change = Number(document.getElementById('adjustChange').value);
    if (!change) { alert('กรุณาใส่จำนวนที่ไม่เป็น 0'); return; }

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'adjust', sku: currentAdjustSku, change })
      });
      const json = await res.json();
      if (json.status !== 'ok') throw new Error(json.message);
      closeModal('adjustModal');
      setStatus('ปรับยอดสำเร็จ');
      loadProducts(true);
    } catch (err) {
      alert('เกิดข้อผิดพลาด: ' + err.message);
    }
  }

  // ===== ลบสินค้า =====
  async function deleteProduct(sku) {
    if (!confirm(`ต้องการลบสินค้าไอดี: ${sku} ใช่หรือไม่?`)) return;
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'delete', sku })
      });
      const json = await res.json();
      if (json.status !== 'ok') throw new Error(json.message);
      setStatus('ลบสินค้าสำเร็จ');
      loadProducts(true);
    } catch (err) {
      alert('เกิดข้อผิดพลาด: ' + err.message);
    }
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('show');
  }

  document.getElementById('searchBox').addEventListener('keydown', e => {
    if (e.key === 'Enter') loadProducts();
  });

  // โหลดข้อมูลครั้งแรก
  loadProducts();
</script>

</body>
</html>
